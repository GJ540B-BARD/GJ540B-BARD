<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blood &amp; Frost – Manga Page Viewer</title>

    <style>
        html {
            scroll-behavior: smooth;
            background: #06080b;
        }

        body {
            margin: 0;
            color: #8fa0ae;
            font: 14px/1.5 Georgia, serif;
            background: #080b0f url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/><feColorMatrix values='0 0 0 0 .55 0 0 0 0 .65 0 0 0 0 .75 0 0 0 .1 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 40%, transparent 45%, #0009 100%);
        }

        #bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            width: 0;
            background: #a3151c;
            z-index: 9;
            box-shadow: 0 0 10px #a3151c;
        }

        header {
            text-align: center;
            padding: 90px 20px 50px;
        }

        h1 {
            margin: 0;
            font: 900 clamp(44px, 9vw, 92px)/1 Impact, "Arial Black", sans-serif;
            letter-spacing: 0.04em;
            color: #cdd8e0;
            text-shadow: 0 4px 0 #000;
        }

        h1 b {
            color: #a3151c;
        }

        header p {
            letter-spacing: 0.35em;
            text-transform: uppercase;
            font-size: 11px;
            color: #5d6e7c;
        }

        .book {
            width: min(760px, 94vw);
            margin: 0 auto;
        }

        .page {
            position: relative;
            aspect-ratio: 2 / 3;
            margin: 0 0 60px;
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1s, transform 1s;
            box-shadow: 0 40px 90px #000, 0 0 0 1px #202b35;
        }

        .page.in {
            opacity: 1;
            transform: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        footer {
            text-align: center;
            padding: 30px 0 120px;
            color: #4b5a67;
            letter-spacing: 0.3em;
            font-size: 11px;
        }
    </style>
</head>

<body>
    <div id="bar"></div>

    <header>
        <h1>BLOOD <b>&amp;</b> FROST</h1>
        <p>A raid in twelve pages &middot; scroll to read</p>
    </header>

    <main class="book"></main>

    <footer>FIN</footer>

    <script>
    const W = 900;
    const H = 1350;
    const ink = '#06090d';
    const red = '#a3151c';
    const TAU = 6.283;
    const $ = s => document.querySelector(s);
    let K = 1;

    function rng(a) {
        return () => {
            a |= 0;
            a = a + 0x6D2B79F5 | 0;
            let t = Math.imul(a ^ a >>> 15, 1 | a);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }

    const tones = {
        dusk: ['#26323e', '#62778a', '#aebfcb'],
        night: ['#04070b', '#121b25', '#2b3a48'],
        dawn: ['#52667a', '#a3b5c3', '#e2eaef'],
        fire: ['#0b0608', '#3a1417', '#7a2a2d']
    };

    function sky(c, r, t) {
        const g = c.createLinearGradient(0, r.y, 0, r.y + r.h);
        tones[t].forEach((s, i) => g.addColorStop(i / 2, s));
        c.fillStyle = g;
        c.fillRect(r.x, r.y, r.w, r.h);
    }

    function hatch(c, x, y, w, h, ang, gap, lw, col, rn) {
        c.save();
        c.beginPath();
        c.rect(x, y, w, h);
        c.clip();
        c.strokeStyle = col;
        c.lineWidth = lw;
        c.beginPath();
        const d = Math.hypot(w, h);
        const cx = x + w / 2;
        const cy = y + h / 2;
        const ca = Math.cos(ang);
        const sa = Math.sin(ang);
        for (let o = -d / 2; o < d / 2; o += gap) {
            const j = rn ? (rn() - .5) * gap * .6 : 0;
            const px = cx - sa * (o + j);
            const py = cy + ca * (o + j);
            c.moveTo(px - ca * d / 2, py - sa * d / 2);
            c.lineTo(px + ca * d / 2, py + sa * d / 2);
        }
        c.stroke();
        c.restore();
    }

    function dots(c, x, y, w, h, g, dir, col, max) {
        c.save();
        c.beginPath();
        c.rect(x, y, w, h);
        c.clip();
        c.fillStyle = col;
        const ca = Math.cos(dir);
        const sa = Math.sin(dir);
        const L = Math.abs(w * ca) + Math.abs(h * sa);
        for (let j = 0, py = y; py < y + h + g; py += g * .866, j++) {
            for (let px = x + (j % 2) * g / 2; px < x + w + g; px += g) {
                const t = ((px - x - w / 2) * ca + (py - y - h / 2) * sa) / L + .5;
                const rr = Math.max(0, Math.min(1, t)) * max;
                if (rr > .45) {
                    c.beginPath();
                    c.arc(px, py, rr, 0, TAU);
                    c.fill();
                }
            }
        }
        c.restore();
    }

    function ridge(c, r, y, amp, col, rn, hc) {
        c.fillStyle = col;
        c.beginPath();
        c.moveTo(r.x, r.y + r.h);
        let py = y;
        for (let x = r.x; x <= r.x + r.w + 20; x += 16) {
            py += (rn() - .5) * amp;
            py = Math.max(y - amp * 2, Math.min(y + amp * 2, py));
            c.lineTo(x, py);
        }
        c.lineTo(r.x + r.w + 20, r.y + r.h);
        c.closePath();
        c.fill();
        if (hc) {
            c.save();
            c.clip();
            hatch(c, r.x, y - amp * 2, r.w, r.h, -.8, 6, 1, hc);
            c.restore();
        }
    }

    function pines(c, r, rn, y, a, b) {
        c.fillStyle = ink;
        for (let x = r.x - 10; x < r.x + r.w + 10; x += 12 + rn() * 18) {
            const h = r.h * (a + rn() * (b - a));
            const bw = 14 + rn() * 10;
            for (let k = 0; k < 3; k++) {
                const yy = y - h * k * .28;
                const hh = h * (1 - k * .22);
                const ww = bw * (1 - k * .2);
                c.beginPath();
                c.moveTo(x, yy - hh * .5);
                c.lineTo(x - ww, yy);
                c.lineTo(x + ww, yy);
                c.fill();
            }
            c.fillRect(x - 2, y - 6, 4, r.y + r.h - y + 8);
        }
    }

    function grd(c, x, y, w, h, stops, v = 1) {
        const g = v ? c.createLinearGradient(0, y, 0, y + h) : c.createLinearGradient(x, 0, x + w, 0);
        stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s));
        c.fillStyle = g;
        c.fillRect(x, y, w, h);
    }

    const POSE = {
        run: { l: .2, g: [.7, -.55], a: -.35, w: -.3, k: 10 },
        strike: { l: .3, g: [.55, -.75], a: -1.25, w: -.3, k: 8 },
        guard: { l: -.06, g: [.28, -.3], a: -.5, w: -1.4, k: 9 },
        kneel: { l: .22, g: [1.25, -.5], a: .9, w: 1.45, h: 22, k: 16 }
    };

    function warrior(c, x, y, h, o = {}) {
        const P = POSE[o.pose || 'guard'];
        const a = o.a ?? P.a;
        const w = o.w ?? P.w;
        const hy = -46 + (P.h || 0);
        const lx = P.l * 34;
        const sy = hy - 34;
        const wp = o.weapon || 'sword';
        const sx = lx + 4;
        const sy2 = sy + 5;
        const hx = sx + Math.cos(a) * 25;
        const hy2 = sy2 + Math.sin(a) * 25;
        const L = { sword: 44, axe: 46, spear: 92 }[wp];
        const ex = hx + Math.cos(w) * L;
        const ey = hy2 + Math.sin(w) * L;
        c.save();
        c.translate(x, y);
        c.scale(h / 100 * (o.dir || 1), h / 100);
        if (o.rot) {
            c.rotate(o.rot);
        }
        const pass = (ox, oy, col) => {
            c.save();
            c.translate(ox, oy);
            c.fillStyle = c.strokeStyle = col;
            c.lineCap = c.lineJoin = 'round';
            c.lineWidth = 9;
            for (const g of P.g) {
                const fx = Math.sin(g) * 34;
                c.beginPath();
                c.moveTo(0, hy);
                c.lineTo(fx / 2 + (P.k || 9), hy / 2 - 4);
                c.lineTo(fx, 0);
                c.stroke();
                c.beginPath();
                c.ellipse(fx + 4, -1, 8, 3.5, 0, 0, TAU);
                c.fill();
            }
            c.beginPath();
            c.moveTo(lx - 6, sy + 2);
            c.quadraticCurveTo(-30 - lx * .5, sy + 14, -26 - P.l * 30, hy + 24);
            c.lineTo(-8, hy + 2);
            c.closePath();
            c.fill();
            c.beginPath();
            c.moveTo(-9, hy + 4);
            c.lineTo(9, hy + 4);
            c.lineTo(12 + lx, sy);
            c.lineTo(-12 + lx, sy);
            c.closePath();
            c.fill();
            c.beginPath();
            c.arc(lx + 3, sy - 9, 7.5, 0, TAU);
            c.fill();
            c.beginPath();
            c.moveTo(lx - 2, sy - 15);
            c.quadraticCurveTo(lx - 22, sy - 14, lx - 32, sy - 2);
            c.quadraticCurveTo(lx - 14, sy - 6, lx - 3, sy - 4);
            c.fill();
            c.beginPath();
            c.moveTo(lx + 6, sy - 5);
            c.quadraticCurveTo(lx + 13, sy + 9, lx + 4, sy + 9);
            c.lineTo(lx + 1, sy - 3);
            c.fill();
            c.lineWidth = 7;
            c.beginPath();
            c.moveTo(sx, sy2);
            c.lineTo(hx, hy2);
            c.stroke();
            c.lineWidth = wp == 'sword' ? 4 : 3.2;
            c.beginPath();
            c.moveTo(hx - Math.cos(w) * (wp == 'spear' ? 26 : 8), hy2 - Math.sin(w) * (wp == 'spear' ? 26 : 8));
            c.lineTo(ex, ey);
            c.stroke();
            if (wp == 'axe') {
                c.save();
                c.translate(ex, ey);
                c.rotate(w);
                c.beginPath();
                c.moveTo(-6, -1);
                c.quadraticCurveTo(-2, -22, 12, -18);
                c.quadraticCurveTo(8, -8, 9, 0);
                c.quadraticCurveTo(8, 8, 12, 16);
                c.quadraticCurveTo(-2, 18, -6, 3);
                c.fill();
                c.restore();
            }
            if (wp == 'spear') {
                c.save();
                c.translate(ex, ey);
                c.rotate(w);
                c.beginPath();
                c.moveTo(14, 0);
                c.lineTo(-3, -5);
                c.lineTo(-3, 5);
                c.fill();
                c.restore();
            }
            if (o.helm) {
                c.beginPath();
                c.arc(lx + 3, sy - 10, 8.6, Math.PI * 1.05, Math.PI * 1.98);
                c.fill();
            }
            c.restore();
        };
        pass(1.7, -1.7, '#8da0b0');
        pass(0, 0, ink);
        if (o.shield) {
            const px = lx + 15;
            const py = sy + 20;
            const R = 17;
            c.fillStyle = '#1d2832';
            c.beginPath();
            c.arc(px, py, R, 0, TAU);
            c.fill();
            c.strokeStyle = '#8da0b0';
            c.lineWidth = 2.4;
            c.stroke();
            c.fillStyle = red;
            c.beginPath();
            c.moveTo(px, py);
            c.arc(px, py, R - 1, .4, 1.9);
            c.fill();
            c.strokeStyle = '#8da0b0';
            c.lineWidth = 1;
            for (let k = 0; k < 6; k++) {
                c.beginPath();
                c.moveTo(px, py);
                c.lineTo(px + Math.cos(k * 1.05) * R, py + Math.sin(k * 1.05) * R);
                c.stroke();
            }
            c.fillStyle = '#b9c7d1';
            c.beginPath();
            c.arc(px, py, 3.4, 0, TAU);
            c.fill();
        }
        if (o.red) {
            c.strokeStyle = red;
            c.lineWidth = 3.6;
            c.lineCap = 'round';
            c.beginPath();
            c.moveTo(hx + Math.cos(w) * L * .45, hy2 + Math.sin(w) * L * .45);
            c.lineTo(ex, ey);
            c.stroke();
            c.fillStyle = red;
            for (let k = 0; k < 3; k++) {
                c.beginPath();
                c.arc(ex + Math.cos(w) * (6 + k * 5), ey + Math.sin(w) * (6 + k * 5) + k * 3, 1.7, 0, TAU);
                c.fill();
            }
        }
        c.restore();
    }

    function ship(c, x, y, s, d) {
        c.save();
        c.translate(x, y);
        c.scale(s * d, s);
        const hull = () => {
            c.beginPath();
            c.moveTo(-88, -30);
            c.quadraticCurveTo(-84, -8, -60, 6);
            c.quadraticCurveTo(0, 26, 60, 6);
            c.quadraticCurveTo(88, -6, 92, -46);
            c.quadraticCurveTo(80, -40, 78, -26);
            c.quadraticCurveTo(60, -12, 0, -12);
            c.quadraticCurveTo(-60, -12, -72, -26);
            c.quadraticCurveTo(-76, -34, -88, -30);
            c.closePath();
        };
        c.strokeStyle = ink;
        c.lineWidth = 3;
        c.lineCap = 'round';
        for (let x = -56; x <= 56; x += 16) {
            c.beginPath();
            c.moveTo(x, -2);
            c.lineTo(x * 1.2 + 8, 22);
            c.stroke();
        }
        c.fillRect(-2, -100, 4, 92);
        c.beginPath();
        c.moveTo(-90, -26);
        c.lineTo(0, -100);
        c.lineTo(90, -40);
        c.lineWidth = 1.2;
        c.stroke();
        c.save();
        c.beginPath();
        c.moveTo(-38, -96);
        c.lineTo(38, -96);
        c.quadraticCurveTo(48, -62, 42, -28);
        c.lineTo(-42, -28);
        c.quadraticCurveTo(-48, -62, -38, -96);
        c.clip();
        for (let i = -6; i < 6; i++) {
            c.fillStyle = i % 2 ? '#8f121a' : '#7f93a1';
            c.fillRect(i * 8, -100, 8, 80);
        }
        hatch(c, -50, -100, 100, 80, .9, 4, 1.2, 'rgba(4,7,10,.5)');
        grd(c, -50, -100, 100, 80, ['rgba(0,0,0,0)', 'rgba(0,0,0,.55)']);
        c.restore();
        c.lineWidth = 3;
        c.beginPath();
        c.moveTo(-46, -97);
        c.lineTo(46, -97);
        c.stroke();
        c.fillStyle = ink;
        hull();
        c.fill();
        c.strokeStyle = '#8da0b0';
        c.lineWidth = 1.6;
        c.beginPath();
        c.moveTo(78, -26);
        c.quadraticCurveTo(60, -12, 0, -12);
        c.quadraticCurveTo(-60, -12, -72, -26);
        c.stroke();
        for (let x = -56; x <= 56; x += 14) {
            c.fillStyle = (x / 14) % 2 ? '#8f121a' : '#aebcc7';
            c.beginPath();
            c.arc(x * .95, -6, 6, 0, TAU);
            c.fill();
            c.strokeStyle = ink;
            c.lineWidth = 1.5;
            c.stroke();
        }
        c.restore();
    }

    const S = {};

    S.moon = (c, p) => {
        const { r, o, rn } = p;
        const t = o.tone || 'night';
        sky(c, r, t);
        const mx = r.x + r.w * .62;
        const my = r.y + r.h * .36;
        const mr = Math.min(r.w, r.h) * .24;
        let g = c.createRadialGradient(mx, my, mr * .8, mx, my, mr * 2.6);
        g.addColorStop(0, 'rgba(175,195,210,.4)');
        g.addColorStop(1, 'rgba(175,195,210,0)');
        c.fillStyle = g;
        c.fillRect(r.x, r.y, r.w, r.h);
        c.fillStyle = '#d9e2e8';
        c.beginPath();
        c.arc(mx, my, mr, 0, TAU);
        c.fill();
        c.save();
        c.clip();
        c.fillStyle = 'rgba(70,92,110,.35)';
        for (let i = 0; i < 16; i++) {
            c.beginPath();
            c.arc(mx + (rn() - .5) * mr * 1.6, my + (rn() - .5) * mr * 1.6, mr * (.04 + rn() * .14), 0, TAU);
            c.fill();
        }
        for (let k = 1; k < 7; k++) {
            c.strokeStyle = 'rgba(30,50,70,.25)';
            c.lineWidth = 1.3;
            c.beginPath();
            c.arc(mx + mr * .15, my + mr * .1, mr * k / 7, 0, TAU);
            c.stroke();
        }
        c.restore();
        c.strokeStyle = 'rgba(163,21,28,.85)';
        c.lineWidth = 4;
        c.beginPath();
        c.arc(mx, my, mr + 5, 2.1, 3.5);
        c.stroke();
        for (let i = 0; i < 10; i++) {
            const y = r.y + r.h * (.12 + rn() * .5);
            c.strokeStyle = `rgba(14,22,30,${.3 + rn() * .35})`;
            c.lineWidth = 2 + rn() * 9;
            c.beginPath();
            c.moveTo(r.x + rn() * r.w * .5, y);
            c.lineTo(r.x + r.w * (.5 + rn() * .5), y + (rn() - .5) * 30);
            c.stroke();
        }
        ridge(c, r, r.y + r.h * .78, 18, '#0a1016', rn, 'rgba(120,145,165,.15)');
        pines(c, r, rn, r.y + r.h * .98, .14, .34);
    };

    S.eyes = (c, p) => {
        const { r, o, rn } = p;
        grd(c, r.x, r.y, r.w, r.h, ['#34434f', '#7d909f', '#27333e']);
        const cy = r.y + r.h * .52;
        const ew = r.w * .2;
        p.st.eyes = [];
        hatch(c, r.x, r.y, r.w, r.h * .3, .3, 7, 1.4, 'rgba(6,10,14,.45)', rn);
        hatch(c, r.x, cy + ew * .45, r.w, r.h * .4, -.5, 6, 1.3, 'rgba(6,10,14,.4)', rn);
        c.fillStyle = 'rgba(6,10,14,.3)';
        c.fillRect(r.x + r.w * .46, r.y, r.w * .08, r.h);
        [[.3, 1], [.7, -1]].forEach(([fx, d]) => {
            const ex = r.x + r.w * fx;
            const ox = ex - ew * d;
            const oy = cy - ew * .1;
            const ix = ex + ew * d;
            const iy = cy + ew * .12;
            const eye = () => {
                c.beginPath();
                c.moveTo(ox, oy);
                c.quadraticCurveTo(ex, cy - ew * .6, ix, iy);
                c.quadraticCurveTo(ex, cy + ew * .34, ox, oy);
            };
            c.save();
            eye();
            c.fillStyle = '#cfd9df';
            c.fill();
            c.clip();
            c.fillStyle = '#16202a';
            c.beginPath();
            c.arc(ex + ew * .05 * d, cy, ew * .44, 0, TAU);
            c.fill();
            c.strokeStyle = '#4d6376';
            c.lineWidth = 3;
            c.beginPath();
            c.arc(ex + ew * .05 * d, cy, ew * .34, 0, TAU);
            c.stroke();
            c.fillStyle = ink;
            c.beginPath();
            c.arc(ex + ew * .05 * d, cy, ew * .17, 0, TAU);
            c.fill();
            grd(c, ex - ew, cy - ew, ew * 2, ew * 1.1, ['rgba(6,10,14,.8)', 'rgba(6,10,14,0)']);
            c.fillStyle = '#eef5fa';
            c.fillRect(ex - ew * .12, cy - ew * .2, ew * .1, ew * .1);
            c.restore();
            c.strokeStyle = ink;
            c.lineCap = 'round';
            c.lineWidth = ew * .16;
            c.beginPath();
            c.moveTo(ox, oy);
            c.quadraticCurveTo(ex, cy - ew * .6, ix, iy);
            c.stroke();
            c.lineWidth = 2.4;
            c.beginPath();
            c.moveTo(ox, oy);
            c.quadraticCurveTo(ex, cy + ew * .34, ix, iy);
            c.stroke();
            c.fillStyle = ink;
            c.beginPath();
            c.moveTo(ox - ew * .2 * d, oy - ew * .5);
            c.lineTo(ix - ew * .1 * d, iy - ew * .62);
            c.lineTo(ix - ew * .1 * d, iy - ew * .28);
            c.lineTo(ox - ew * .2 * d, oy - ew * .15);
            c.fill();
            c.strokeStyle = 'rgba(120,140,155,.6)';
            c.lineWidth = 1.2;
            for (let k = 0; k < 14; k++) {
                const t = k / 14;
                c.beginPath();
                c.moveTo(ox - ew * .2 * d + t * (ix - ox + ew * .1 * d), oy - ew * .3 - t * ew * .2 + t * (iy - oy) * .5);
                c.lineTo(ox - ew * .1 * d + t * (ix - ox + ew * .1 * d), oy - ew * .55 + t * (iy - oy) * .5);
                c.stroke();
            }
            p.st.eyes.push([ex - ew * .12, cy - ew * .2, ew]);
        });
        if (o.scar) {
            const x0 = r.x + r.w * .2;
            const y0 = r.y + r.h * .1;
            const x1 = r.x + r.w * .4;
            const y1 = r.y + r.h * .8;
            c.strokeStyle = '#7d0f16';
            c.lineWidth = 7;
            c.lineCap = 'round';
            c.beginPath();
            c.moveTo(x0, y0);
            c.lineTo(x1, y1);
            c.stroke();
            c.strokeStyle = ink;
            c.lineWidth = 2;
            for (let k = 1; k < 9; k++) {

    S.wall = (c, p) => {

    const DEF = {

    const FX = {
        snow(c, t, p) {
            const r = p.r;
            const s = p.st.snow || (p.st.snow = Array.from({ length: Math.round(40 + r.w * r.h / 6500) }, () => ({
                x: Math.random() * r.w,
                y: Math.random() * r.h,
                z: .4 + Math.random() * 1.2,
                ph: Math.random() * TAU
            })));
            c.fillStyle = 'rgba(225,236,244,.8)';
            for (const f of s) {
                f.y += f.z * .9 * K;
                f.x += (Math.sin(t / 900 + f.ph) * .4 + .6) * K;
                if (f.y > r.h) {
                    f.y = -4;
                }
                if (f.x > r.w) {
                    f.x = 0;
                }
                c.beginPath();
                c.arc(r.x + f.x, r.y + f.y, f.z * 1.5, 0, TAU);
                c.fill();
            }
        },
        grass(c, t, p) {
            c.lineCap = 'round';
            for (const b of p.st.grass) {
                const sw = Math.sin(t / 700 + b.ph + b.x * .02) * b.h * .28 + Math.sin(t / 230 + b.ph) * b.h * .04;
                c.strokeStyle = b.c;
                c.lineWidth = b.w;
                c.beginPath();
                c.moveTo(b.x, b.y);
                c.quadraticCurveTo(b.x + sw * .4, b.y - b.h * .6, b.x + sw, b.y - b.h);
                c.stroke();
            }
        },
        fire(c, t, p) {
            c.globalCompositeOperation = 'lighter';
            for (const f of p.st.fires) {
                const g = c.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.s * 3.4);
                g.addColorStop(0, 'rgba(190,40,40,.38)');
                g.addColorStop(1, 'rgba(190,40,40,0)');
                c.fillStyle = g;
                c.beginPath();
                c.arc(f.x, f.y, f.s * 3.4, 0, TAU);
                c.fill();
            }
            c.globalCompositeOperation = 'source-over';
            for (const f of p.st.fires) {
                for (let k = 0; k < 3; k++) {
                    for (let j = -1; j <= 1; j++) {
                        const w = f.s * (1 - k * .27);
                        const h = f.s * (2.4 - k * .6 - Math.abs(j) * .5) * (1 + .2 * Math.sin(t / 110 + f.x + k * 2 + j));
                        const cx = f.x + j * f.s * .7;
                        const sw = Math.sin(t / 130 + f.x + j * 2) * w * .3;
                        c.fillStyle = ['#5b0a10', '#a3151c', '#d9633f'][k];
                        c.beginPath();
                        c.moveTo(cx - w * .6, f.y);
                        c.quadraticCurveTo(cx - w * .7, f.y - h * .5, cx + sw, f.y - h);
                        c.quadraticCurveTo(cx + w * .7, f.y - h * .45, cx + w * .6, f.y);
                        c.fill();
                    }
                }
            }
        },
        embers(c, t, p) {
            const f = p.st.fires;
            const e = p.st.em || (p.st.em = Array.from({ length: 50 }, (_, i) => ({ i, u: Math.random() })));
            c.fillStyle = '#e0714f';
            for (const q of e) {
                q.u += .004 * K;
                if (q.u > 1) {
                    q.u = 0;
                }
                const o = f[q.i % f.length];
                c.globalAlpha = 1 - q.u;
                c.beginPath();
                c.arc(o.x + Math.sin(q.u * 9 + q.i) * 30 + q.u * 40, o.y - o.s * .5 - q.u * o.s * 5, 1.6, 0, TAU);
                c.fill();
            }
            c.globalAlpha = 1;
        },
        smoke(c, t, p) {
            for (const [sx, sy] of p.st.smoke) {
                for (let k = 0; k < 8; k++) {
                    const u = (t / 5000 + k / 8) % 1;
                    const x = sx + Math.sin(u * 5 + k + sx) * 20 + u * 45;
                    const y = sy - u * p.r.h * .4;
                    const rr = 12 + u * 52;
                    c.fillStyle = `rgba(12,18,24,${.32 * (1 - u)})`;
                    c.beginPath();
                    c.arc(x, y, rr, 0, TAU);
                    c.fill();
                }
            }
        },
        waves(c, t, p) {
            const { y0, y1 } = p.st.sea;
            const r = p.r;
            c.lineWidth = 1.6;
            for (let k = 0, y = y0; y < y1; k++, y += 7 + k * .5) {
                c.strokeStyle = `rgba(190,208,222,${k % 3 ? .12 : .3})`;
                c.beginPath();
                for (let x = r.x; x <= r.x + r.w; x += 14) {
                    const yy = y + Math.sin(x * .03 + t / 600 + k * 1.3) * (3 + k * .35);
                    x == r.x ? c.moveTo(x, yy) : c.lineTo(x, yy);
                }
                c.stroke();
            }
        },
        blood(c, t, p) {
            const f = p.st.flow;
            c.lineCap = c.lineJoin = 'round';
            const path = () => {
                c.beginPath();
                f.pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y));
            };
            path();
            c.strokeStyle = 'rgba(50,5,9,.9)';
            c.lineWidth = f.w;
            c.stroke();
            path();
            c.strokeStyle = '#8e1018';
            c.lineWidth = f.w * .72;
            c.stroke();
            path();
            c.setLineDash([f.w * 1.2, f.w * 2.4]);
            c.lineDashOffset = -t / 18;
            c.strokeStyle = 'rgba(222,80,70,.55)';
            c.lineWidth = f.w * .22;
            c.stroke();
            c.setLineDash([]);
        },
        crows(c, t, p) {
            const r = p.r;
            c.strokeStyle = ink;
            c.lineWidth = 2.6;
            c.lineCap = 'round';
            for (let i = 0; i < 4; i++) {
                const u = (t / (9000 + i * 1700) + i * .23) % 1;
                const x = r.x - 30 + u * (r.w + 60);
                const y = r.y + r.h * (.15 + .1 * i) + Math.sin(u * 12 + i) * 14;
                const f = Math.sin(t / 110 + i * 2) * 7;
                const s = 9 + i % 3 * 3;
                c.beginPath();
                c.moveTo(x - s, y - f);
                c.quadraticCurveTo(x - s / 2, y - s / 2, x, y);
                c.quadraticCurveTo(x + s / 2, y - s / 2, x + s, y - f);
                c.stroke();
            }
        },
        sparks(c, t, p) {
            const [cx, cy] = p.st.sp;
            c.lineCap = 'round';
            for (let i = 0; i < 16; i++) {
                const q = t / 600 + i * .37;
                const u = q % 1;
                const a = i * 2.4 + Math.floor(q) * 1.3;
                const d = 10 + u * 90;
                const l = 8 * (1 - u);
                c.strokeStyle = `rgba(230,240,250,${1 - u})`;
                c.lineWidth = 2 * (1 - u) + .5;
                c.beginPath();
                c.moveTo(cx + Math.cos(a) * d, cy + Math.sin(a) * d);
                c.lineTo(cx + Math.cos(a) * (d + l), cy + Math.sin(a) * (d + l));
                c.stroke();
            }
        },
        speed(c, t, p) {
            const { cx, cy, r0 } = p.st.speed;
            const q = rng(Math.floor(t / 90) + p.seed);
            c.lineCap = 'round';
            for (let i = 0; i < 46; i++) {
                const a = q() * TAU;
                const d0 = r0 * (1 + q() * .5);
                const d1 = d0 + 60 + q() * 220;
                c.strokeStyle = q() < .6 ? 'rgba(195,212,225,.5)' : 'rgba(6,10,14,.7)';
                c.lineWidth = 1 + q() * 3;
                c.beginPath();
                c.moveTo(cx + Math.cos(a) * d0, cy + Math.sin(a) * d0);
                c.lineTo(cx + Math.cos(a) * d1, cy + Math.sin(a) * d1);
                c.stroke();
            }
        },
        glint(c, t, p) {
            for (const [x, y, e] of p.st.eyes) {
                c.fillStyle = `rgba(235,245,252,${.5 + .4 * Math.sin(t / 500 + x)})`;
                c.fillRect(x, y, e * .1, e * .1);
                c.fillRect(x + e * .16, y + e * .14, e * .05, e * .05);
            }
        },
        drops(c, t, p) {
            for (const [ox, oy] of p.st.dr || []) {
                for (let i = 0; i < 3; i++) {
                    const u = (t / (1400 + i * 350) + i * .31) % 1;
                    const y = oy + u * u * p.r.h * .22;
                    const x = ox + i * 7 - 7;
                    c.fillStyle = `rgba(150,16,24,${1 - u * .6})`;
                    c.beginPath();
                    c.arc(x, y, 3.2 - u * 1.4, 0, TAU);
                    c.fill();
                    c.beginPath();
                    c.moveTo(x - 2.2, y - 1);
                    c.lineTo(x, y - 10 - u * 8);
                    c.lineTo(x + 2.2, y - 1);
                    c.fill();
                }
            }
        }
    };

    const PAGES = [
        {

            p: [

            ]
        },

    function layout(rn, rows) {
        const M = 44;
        const G = 16;
        const n = rows.length;
        const hs = rows.map(() => .8 + rn() * .5);
        const T = hs.reduce((a, b) => a + b);
        let acc = 0;
        const Y = [M];
        const tl = [0];
        const out = [];
        hs.forEach((h, i) => {
            acc += h;
            Y.push(M + (H - 2 * M) * acc / T);
            tl.push(i < n - 1 ? (rn() < .5 ? -1 : 1) * (40 + rn() * 80) : 0);
        });
        rows.forEach((k, i) => {
            const top = x => Y[i] + tl[i] * (x - W / 2) / W + (i ? G / 2 : 0);
            const bot = x => Y[i + 1] + tl[i + 1] * (x - W / 2) / W - (i < n - 1 ? G / 2 : 0);
            const xs = W * (.36 + rn() * .28);
            const sl = (rn() < .5 ? -1 : 1) * (.18 + rn() * .25);
            const ym = (Y[i] + Y[i + 1]) / 2;
            const sp = y => xs + (y - ym) * sl;
            const cols = k == 1 ? [[() => M, () => W - M]] : [[() => M, y => sp(y) - G / 2], [y => sp(y) + G / 2, () => W - M]];
            cols.forEach(([L, Rr]) => {
                const cr = (xf, yf, x0, y0) => {
                    let x = x0;
                    let y = y0;
                    for (let j = 0; j < 6; j++) {
                        y = yf(x);
                        x = xf(y);
                    }
                    return [x, y];
                };
                out.push([
                    cr(L, top, M, Y[i]),
                    cr(Rr, top, W - M, Y[i]),
                    cr(Rr, bot, W - M, Y[i + 1]),
                    cr(L, bot, M, Y[i + 1])
                ]);
            });
        });
        return out;
    }

    const path = (c, P) => {
        c.beginPath();
        P.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y));
        c.closePath();
    };

    function inside(P, x, y) {
        let k = false;
        for (let i = 0, j = 3; i < 4; j = i++) {
            const [a, b] = P[i];
            const [d, e] = P[j];
            if ((b > y) != (e > y) && x < (d - a) * (y - b) / (e - b) + a) {
                k = !k;
            }
        }
        return k;
    }

    const pages = PAGES.map((d, i) => {
        const rn = rng(i * 977 + 13);
        const polys = layout(rn, d.rows);
        return {
            i,
            vis: false,
            panels: d.p.map(([k, o], j) => {
                const poly = polys[j];
                const xs = poly.map(q => q[0]);
                const ys = poly.map(q => q[1]);
                const x = Math.min(...xs);
                const y = Math.min(...ys);
                return {
                    k,
                    o,
                    poly,
                    r: { x, y, w: Math.max(...xs) - x, h: Math.max(...ys) - y },
                    st: {},
                    rn: rng(i * 131 + j * 17 + 5),
                    fx: o.fx || DEF[k],
                    seed: i * 40 + j
                };
            })
        };
    });

    function caption(c, p) {
        const { r, o, poly } = p;
        c.font = 'italic 21px Georgia,serif';
        const mw = Math.min(r.w * .62, 340);
        const ls = [];
        let l = '';
        for (const w of o.cap.split(' ')) {
            const t = l ? l + ' ' + w : w;
            if (c.measureText(t).width > mw - 24 && l) {
                ls.push(l);
                l = w;
            }
            else {
                l = t;
            }
        }
        ls.push(l);
        const bh = ls.length * 27 + 18;
        const m = 26;
        let best = null;
        for (let yy = r.y + 20; yy <= r.y + r.h - bh - 20 && !best; yy += 16) {
            const y = o.cp == 'b' ? r.y + r.h - bh - (yy - r.y) : yy;
            for (let xx = r.x + 20; xx <= r.x + r.w - mw - 20; xx += 16) {
                const x = xx;
                if ([[x - m, y - m], [x + mw + m, y - m], [x + mw + m, y + bh + m], [x - m, y + bh + m]].every(q => inside(poly, q[0], q[1]))) {
                    best = [x, y];
                    break;
                }
            }
        }
        const [x, y] = best || [r.x + r.w / 2 - mw / 2, r.y + r.h / 2];
        c.fillStyle = '#d6dde3';
        c.strokeStyle = ink;
        c.lineWidth = 3;
        c.fillRect(x, y, mw, bh);
        c.strokeRect(x, y, mw, bh);
        c.fillStyle = ink;
        c.textAlign = 'left';
        c.textBaseline = 'alphabetic';
        ls.forEach((s, i) => c.fillText(s, x + 12, y + 30 + i * 27));
    }

    function title(c, p) {
        const r = p.r;
        c.save();
        c.translate(r.x + r.w / 2, r.y + r.h * .3);
        c.rotate(-.06);
        c.textAlign = 'center';
        c.textBaseline = 'alphabetic';
        c.lineJoin = 'round';
        const f = Math.min(150, r.w * .2);
        c.font = `900 ${f}px Impact,"Arial Black",sans-serif`;
        c.lineWidth = f * .12;
        c.strokeStyle = ink;
        c.strokeText('BLOOD', 0, 0);
        c.fillStyle = '#b5191f';
        c.fillText('BLOOD', 0, 0);
        c.font = `900 ${f * .55}px Impact,"Arial Black",sans-serif`;
        c.strokeText('& FROST', 0, f * .62);
        c.fillStyle = '#d4dee5';
        c.fillText('& FROST', 0, f * .62);
        c.restore();
    }

    function renderBase(pg) {
        const b = pg.base = document.createElement('canvas');
        b.width = W;
        b.height = H;
        const c = b.getContext('2d');
        const rn = rng(pg.i + 99);
        c.fillStyle = '#a9b6c1';
        c.fillRect(0, 0, W, H);
        for (let i = 0; i < 3500; i++) {
            c.fillStyle = rn() < .5 ? 'rgba(255,255,255,.07)' : 'rgba(10,25,40,.07)';
            c.fillRect(rn() * W, rn() * H, 1 + rn() * 2, 1 + rn() * 2);
        }
        pg.panels.forEach(p => {
            const { r } = p;
            c.save();
            path(c, p.poly);
            c.clip();
            S[p.k](c, p);
            dots(c, r.x, r.y, r.w, r.h, 7, Math.PI / 2, 'rgba(3,6,10,.5)', 2.4);
            const g = c.createRadialGradient(r.x + r.w / 2, r.y + r.h / 2, Math.min(r.w, r.h) * .3, r.x + r.w / 2, r.y + r.h / 2, Math.max(r.w, r.h) * .75);
            g.addColorStop(0, 'rgba(0,0,0,0)');
            g.addColorStop(1, 'rgba(0,0,0,.6)');
            c.fillStyle = g;
            c.fillRect(r.x, r.y, r.w, r.h);
            if (p.o.title) {
                title(c, p);
            }
            if (p.o.cap) {
                caption(c, p);
            }
            c.restore();
        });
        c.fillStyle = '#1b2530';
        c.font = 'italic 17px Georgia,serif';
        c.textAlign = 'center';
        c.fillText('— ' + (pg.i + 1) + ' —', W / 2, H - 14);
    }

    const book = $('.book');

    pages.forEach(pg => {
        const d = document.createElement('div');
        d.className = 'page';
        d.dataset.i = pg.i;
        const cv = document.createElement('canvas');
        cv.width = W;
        cv.height = H;
        d.append(cv);
        book.append(d);
        pg.c = cv.getContext('2d');
        pg.el = d;
    });

    const io = new IntersectionObserver(es => es.forEach(e => {
        const pg = pages[+e.target.dataset.i];
        pg.vis = e.isIntersecting;
        if (e.isIntersecting) {
            if (!pg.base) {
                renderBase(pg);
            }
            e.target.classList.add('in');
        }
    }), { rootMargin: '400px 0px' });

    pages.forEach(pg => io.observe(pg.el));

    let last = 0;

    function frame(t) {
        K = Math.min(3, (t - last) / 16.7) || 1;
        last = t;
        for (const pg of pages) {
            if (!pg.vis || !pg.base) {
                continue;
            }
            const c = pg.c;
            c.drawImage(pg.base, 0, 0);
            for (const p of pg.panels) {
                c.save();
                path(c, p.poly);
                c.clip();
                for (const f of p.fx) {
                    FX[f](c, t, p);
                }
                c.restore();
            }
            c.lineJoin = 'miter';
            c.strokeStyle = ink;
            c.lineWidth = 7;
            for (const p of pg.panels) {
                path(c, p.poly);
                c.stroke();
            }
        }
        requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);

    addEventListener('scroll', () => {
        const d = document.documentElement;
        $('#bar').style.width = 100 * d.scrollTop / (d.scrollHeight - innerHeight) + '%';
    }, { passive: true });
    </script>
